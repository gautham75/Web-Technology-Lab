<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>experiment8-2</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for in-browser JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .app {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --text: #222222;
      --muted: #666666;
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --border: #cccccc;
      --track: #e5e7eb;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s ease, color 0.3s ease;
    }

    .app.dark {
      --bg: #111827;
      --surface: #1f2937;
      --text: #ffffff;
      --muted: #d1d5db;
      --border: #4b5563;
      --track: #374151;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 30px;
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .nav-left,
    .nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .menu-btn {
      display: none;
      border: none;
      background: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text);
    }

    .search-bar {
      flex: 1;
      max-width: 420px;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--bg);
      color: var(--text);
    }

    .icon-btn {
      position: relative;
      border: none;
      background: none;
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .icon-btn:hover {
      transform: scale(1.15);
    }

    .badge {
      position: absolute;
      top: -6px;
      right: -8px;
      background: #ef4444;
      color: white;
      font-size: 11px;
      border-radius: 50%;
      padding: 2px 6px;
    }

    .notification-wrapper {
      position: relative;
    }

    .dropdown {
      position: absolute;
      right: 0;
      top: 40px;
      width: 260px;
      background: var(--surface);
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      padding: 10px;
      z-index: 50;
    }

    .dropdown p {
      padding: 10px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }

    .dropdown p:last-child {
      border-bottom: none;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary);
    }

    .btn {
      border: none;
      background: var(--primary);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 68px);
    }

    .sidebar {
      width: 220px;
      background: var(--surface);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-right: 1px solid var(--border);
      transition: all 0.3s ease;
    }

    .sidebar a {
      text-decoration: none;
      color: var(--muted);
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .sidebar a:hover {
      background: var(--bg);
      color: var(--primary);
    }

    .overlay {
      display: none;
    }

    .dashboard {
      flex: 1;
      padding: 40px;
    }

    .welcome {
      margin-bottom: 30px;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: var(--muted);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .card {
      background: var(--surface);
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h3 {
      color: var(--muted);
      margin-bottom: 15px;
    }

    .card p {
      font-size: 28px;
      font-weight: bold;
      color: var(--primary);
    }

    .course-section {
      margin-top: 40px;
    }

    .course-section h2 {
      margin-bottom: 20px;
    }

    .empty {
      color: var(--muted);
    }

    .course-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .course-item {
      background: var(--surface);
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      transition: transform 0.3s ease;
    }

    .course-item:hover {
      transform: translateY(-3px);
    }

    .course-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .progress {
      height: 10px;
      background: var(--track);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .task-section {
      margin-top: 40px;
    }

    .task-section h2 {
      margin-bottom: 15px;
    }

    .task-form {
      display: flex;
      gap: 10px;
    }

    .task-form input {
      padding: 12px;
      width: 280px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
    }

    .task-list {
      list-style: none;
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }

    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      padding: 14px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
    }

    .task-item label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .done {
      text-decoration: line-through;
      color: var(--muted);
    }

    .delete-btn {
      border: none;
      background: #ef4444;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .delete-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .bottom-bar {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .bottom-bar a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .bottom-bar a:hover {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .menu-btn {
        display: block;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 40;
        padding-top: 80px;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .overlay {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 30;
      }

      .navbar {
        padding: 12px 16px;
        gap: 10px;
      }
    }

    @media (max-width: 600px) {
      .dashboard {
        padding: 20px;
      }

      .cards,
      .course-list {
        grid-template-columns: 1fr;
      }

      .nav-left h2 {
        display: none;
      }

      .task-form {
        flex-direction: column;
      }

      .task-form input {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const profileImage =
      "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%234f46e5'%3E%3Ccircle cx='50' cy='50' r='50' fill='%234f46e5'/%3E%3Ccircle cx='50' cy='38' r='18' fill='white'/%3E%3Cpath d='M20 85 c0 -18 16 -28 30 -28 s30 10 30 28 Z' fill='white'/%3E%3C/svg%3E";

    function Navbar({
      darkMode,
      toggleTheme,
      toggleMenu,
      search,
      setSearch,
      notifications,
      showNotifications,
      toggleNotifications,
    }) {
      return (
        <nav className="navbar" id="profile">
          <div className="nav-left">
            <button className="menu-btn" onClick={toggleMenu} aria-label="Menu">
              ☰
            </button>
            <h2>EduDashboard URK24CS1158</h2>
          </div>

          <input
            className="search-bar"
            type="text"
            placeholder="Search courses..."
            value={search}
            onChange={(event) => setSearch(event.target.value)}
          />

          <div className="nav-right">
            <div className="notification-wrapper">
              <button
                className="icon-btn"
                onClick={toggleNotifications}
                aria-label="Notifications"
              >
                🔔
                {notifications.length > 0 && (
                  <span className="badge">{notifications.length}</span>
                )}
              </button>
              {showNotifications && (
                <div className="dropdown">
                  {notifications.map((note, index) => (
                    <p key={index}>{note}</p>
                  ))}
                </div>
              )}
            </div>

            <button className="btn" onClick={toggleTheme}>
              {darkMode ? "Light" : "Dark"}
            </button>

            <img className="avatar" src={profileImage} alt="Student profile" />
          </div>
        </nav>
      );
    }

    function Sidebar({ open, onClose }) {
      return (
        <React.Fragment>
          <aside className={open ? "sidebar open" : "sidebar"}>
            <a href="#home" onClick={onClose}>🏠 Dashboard</a>
            <a href="#courses" onClick={onClose}>📚 Courses</a>
            <a href="#tasks" onClick={onClose}>✅ Tasks</a>
            <a href="#profile" onClick={onClose}>👤 Profile</a>
          </aside>

          {open && <div className="overlay" onClick={onClose}></div>}
        </React.Fragment>
      );
    }

    function StatCard({ title, value }) {
      return (
        <div className="card">
          <h3>{title}</h3>
          <p>{value}</p>
        </div>
      );
    }

    function ProgressBar({ percent }) {
      return (
        <div className="progress">
          <div className="progress-fill" style={{ width: `${percent}%` }}></div>
        </div>
      );
    }

    function CourseList({ courses }) {
      return (
        <section className="course-section" id="courses">
          <h2>My Courses</h2>
          {courses.length === 0 && <p className="empty">No courses found.</p>}
          <div className="course-list">
            {courses.map((course) => (
              <div className="course-item" key={course.name}>
                <div className="course-top">
                  <span>{course.name}</span>
                  <strong>{course.progress}%</strong>
                </div>
                <ProgressBar percent={course.progress} />
              </div>
            ))}
          </div>
        </section>
      );
    }

    function TaskSection({ tasks, onAddTask, onToggleTask, onDeleteTask }) {
      const [task, setTask] = useState("");

      const handleAdd = () => {
        if (task.trim() === "") return;
        onAddTask(task.trim());
        setTask("");
      };

      return (
        <section className="task-section" id="tasks">
          <h2>Add Task</h2>
          <div className="task-form">
            <input
              type="text"
              placeholder="Enter a task"
              value={task}
              onChange={(event) => setTask(event.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") handleAdd(); }}
            />
            <button className="btn" onClick={handleAdd}>Add</button>
          </div>

          <ul className="task-list">
            {tasks.map((item) => (
              <li className="task-item" key={item.id}>
                <label>
                  <input
                    type="checkbox"
                    checked={item.done}
                    onChange={() => onToggleTask(item.id)}
                  />
                  <span className={item.done ? "done" : ""}>{item.text}</span>
                </label>
                <button className="delete-btn" onClick={() => onDeleteTask(item.id)}>
                  Delete
                </button>
              </li>
            ))}
          </ul>
        </section>
      );
    }

    const courseData = [
      { name: "Web Technology", progress: 80 },
      { name: "Database Management", progress: 65 },
      { name: "Machine Learning", progress: 40 },
      { name: "Computer Networks", progress: 90 },
    ];

    const notifications = [
      "Assignment 3 due tomorrow",
      "New material added: Machine Learning",
      "Lab exam on Friday",
    ];

    function App() {
      const [darkMode, setDarkMode] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const [showNotifications, setShowNotifications] = useState(false);
      const [search, setSearch] = useState("");
      const [tasks, setTasks] = useState([
        { id: 1, text: "WT Experiment 1", done: true },
        { id: 2, text: "WT Experiment 2", done: false },
      ]);

      const addTask = (text) => {
        setTasks([...tasks, { id: Date.now(), text, done: false }]);
      };

      const toggleTask = (id) => {
        setTasks(tasks.map((t) => (t.id === id ? { ...t, done: !t.done } : t)));
      };

      const deleteTask = (id) => setTasks(tasks.filter((t) => t.id !== id));

      const filteredCourses = courseData.filter((course) =>
        course.name.toLowerCase().includes(search.toLowerCase())
      );

      const completion = Math.round(
        courseData.reduce((sum, c) => sum + c.progress, 0) / courseData.length
      );

      return (
        <div className={darkMode ? "app dark" : "app"}>
          <Navbar
            darkMode={darkMode}
            toggleTheme={() => setDarkMode(!darkMode)}
            toggleMenu={() => setMenuOpen(!menuOpen)}
            search={search}
            setSearch={setSearch}
            notifications={notifications}
            showNotifications={showNotifications}
            toggleNotifications={() => setShowNotifications(!showNotifications)}
          />
          <div className="layout">
            <Sidebar open={menuOpen} onClose={() => setMenuOpen(false)} />
            <main className="dashboard" id="home">
              <section className="welcome">
                <h1>Welcome URK24CS1158!!!</h1>
                <p>Here is your academic overview.</p>
              </section>

              <section className="cards">
                <StatCard title="Courses" value={courseData.length} />
                <StatCard title="Assignments" value="12" />
                <StatCard title="Attendance" value="92%" />
                <StatCard title="Completion" value={`${completion}%`} />
              </section>

              <CourseList courses={filteredCourses} />
              <TaskSection
                tasks={tasks}
                onAddTask={addTask}
                onToggleTask={toggleTask}
                onDeleteTask={deleteTask}
              />

              <div className="bottom-bar">
                <span>Experiment 8.2: Additional Student Challenge</span>
                <a href="Lab-Experiment 8.html">← Back to Overview</a>
              </div>
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>

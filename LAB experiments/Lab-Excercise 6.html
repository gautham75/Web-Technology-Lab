<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Web Technology Lab - Experiment 6" />
  <title>Lab Exercise 6</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f1a;
      --surface: #141828;
      --card: #1a1f35;
      --card-hover: #1f2640;
      --border: rgba(255,255,255,0.07);
      --accent: #6c63ff;
      --accent2: #00d4aa;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --gradient: linear-gradient(135deg, #6c63ff 0%, #00d4aa 100%);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: 500px; height: 500px;
      background: rgba(108,99,255,0.15);
      top: -100px; left: -100px;
    }
    body::after {
      width: 400px; height: 400px;
      background: rgba(0,212,170,0.1);
      bottom: -80px; right: -80px;
    }

    .wrapper { position: relative; z-index: 1; }

    .hero {
      text-align: center;
      padding: 80px 20px 60px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(108,99,255,0.15);
      border: 1px solid rgba(108,99,255,0.35);
      color: #a59dff;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 100px;
      margin-bottom: 24px;
    }
    .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #6c63ff; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }

    .hero h1 {
      font-size: clamp(2rem, 6vw, 3.8rem);
      font-weight: 800;
      line-height: 1.15;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }
    
    .back-link {
      display: inline-block;
      margin-bottom: 30px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .back-link:hover { opacity: 0.8; }

    .divider {
      height: 1px;
      background: var(--border);
      max-width: 900px;
      margin: 0 auto;
    }

    .section { max-width: 960px; margin: 0 auto; padding: 50px 20px; }
    
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: background 0.25s, border-color 0.25s, transform 0.25s, box-shadow 0.25s;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gradient);
      opacity: 0;
      transition: opacity 0.3s;
      border-radius: inherit;
    }
    .card:hover {
      background: var(--card-hover);
      border-color: rgba(108,99,255,0.4);
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(108,99,255,0.15);
    }
    .card:hover::before { opacity: 0.04; }

    .card-num {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }
    .card-arrow {
      position: absolute;
      top: 20px; right: 20px;
      color: var(--muted);
      font-size: 1rem;
      transition: transform 0.25s, color 0.25s;
    }
    .card:hover .card-arrow { transform: translate(3px,-3px); color: var(--accent); }

  </style>
</head>
<body>
<div class="wrapper">

  <header class="hero">
    <a href="../index.html" class="back-link">← Back to Index</a>
    <br>
    <div class="badge"><span class="dot"></span> Lab Exercise 6</div>
    <h1>Experiment 6<br>Sub-Tasks</h1>
  </header>

  <div class="divider"></div>

  <main class="section">
    <div class="grid">

      <a class="card" href="Lab-Excercise 6.1.html">
        <span class="card-arrow">↗</span>
        <div class="card-num">Task 01</div>
        <div class="card-title">Lab Exercise 6.1</div>
      </a>

      <a class="card" href="Lab-Excercise 6.2.html">
        <span class="card-arrow">↗</span>
        <div class="card-num">Task 02</div>
        <div class="card-title">Lab Exercise 6.2</div>
      </a>

      <a class="card" href="Lab-Excercise 6.3.html">
        <span class="card-arrow">↗</span>
        <div class="card-num">Task 03</div>
        <div class="card-title">Lab Exercise 6.3</div>
      </a>

      <a class="card" href="Lab-Excercise 6.4.html">
        <span class="card-arrow">↗</span>
        <div class="card-num">Task 04</div>
        <div class="card-title">Lab Exercise 6.4</div>
      </a>

      <a class="card" href="Lab-Excercise 6.5.html">
        <span class="card-arrow">↗</span>
        <div class="card-num">Task 05</div>
        <div class="card-title">Lab Exercise 6.5</div>
      </a>

    </div>
  </main>

</div>
</body>
</html>
